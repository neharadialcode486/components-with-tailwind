<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Second Counter</title>
    <script>
        tailwind.config = {
            theme: {
                container: {
                    padding: '12px',
                    center: true,
                    screens: {
                        sm: "600px",
                        md: "728px",
                        lg: "984px",
                        xl: "1240px",
                        "2xl": "1496px",
                    },
                },
                extend: {
                    colors: {
                        orange: '#FF8C00',
                        glacier: '#85B6A6',
                        neptune: '#82B2C2',
                        'venice-blue': '#076787',
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

        body {
            font-family: "Inter", sans-serif;
        }
    </style>
</head>
<!-- ==counter 2 UI -->

<body>
    <section class="min-h-screen bg-[#F5F8FA] flex justify-center items-center relative">
        <img class="absolute top-0 right-0" src="./assets/images/svg/counter-top-img.svg" alt="img">
        <div class="container py-20">
            <div class="text-center">
                <p class="text-venice-blue text-balance font-medium">PLATFORM</p>
                <p class="text-[40px] font-normal pt-1.5 max-lg:text-4xl max-md:text-3xl max-sm:text-2xl">Through <span
                        class="font-semibold">Our
                        Platform</span></p>
                <p class="text-base font-normal opacity-70 pt-3">We’ve helped out partners and patients achieve</p>
            </div>
            <div id="counter"
                class="flex flex-wrap gap-7 justify-center items-center mt-[60px] max-md:mt-10 max-sm:mt-6">
                <div
                    class="platform-box-one py-[42.5px] px-[60px] bg-glacier text-center relative w-[268px] rounded max-md:h-[207px] max-sm:h-[170px] max-sm:py-0 flex items-center flex-col justify-center">
                    <div class="flex justify-center">
                        <p class="font-semibold text-white text-6xl max-lg:text-5xl max-md:text-4xl max-sm:text-3xl leading-[110%] count"
                            data-count="50">0</p>
                        <span
                            class="font-semibold text-white text-6xl max-lg:text-5xl max-md:text-4xl max-sm:text-3xl leading-[110%]">%</span>
                    </div>
                    <p class="text-xl max-md:text-base max-sm:text-sm font-normal text-white">Reduction <span
                            class="block">in Pain</span></p>
                    <img class="absolute right-0 bottom-0 pointer-events-none"
                        src="./assets/images/svg/counter-two-img.svg" alt="plus">
                </div>
                <div
                    class="platform-box-one py-[48px] px-[42px] bg-neptune text-center relative w-[268px] rounded max-md:h-[207px] max-sm:h-[170px] max-sm:py-0 flex items-center flex-col justify-center">
                    <div class="flex justify-center ">
                        <p class="font-semibold text-white text-[50px] leading-[110%] max-lg:text-5xl max-md:text-4xl max-sm:text-3xl count"
                            data-count="90">0</p>
                        <span
                            class="font-semibold text-white text-[50px] max-lg:text-5xl max-md:text-4xl max-sm:text-3xl leading-[110%]">%</span>
                    </div>
                    <p class="text-xl max-md:text-base max-sm:text-sm font-normal text-white">Increase
                        In-Patient<span class="block">Satisfaction</span>
                    </p>
                    <img class="absolute right-0 bottom-0 pointer-events-none"
                        src="./assets/images/svg/counter-two-img.svg" alt="plus">
                </div>
                <div
                    class="platform-box-one py-[62px] px-[55px] bg-venice-blue text-center relative w-[268px] rounded max-md:h-[207px] max-sm:h-[170px] max-sm:py-0 flex items-center flex-col justify-center">
                    <div class="flex justify-center">
                        <p class="font-semibold text-white text-[50px] leading-[110%] max-lg:text-5xl max-md:text-4xl max-sm:text-3xl count"
                            data-count="60">0</p>
                        <span
                            class="font-semibold text-white text-[50px] max-lg:text-5xl max-md:text-4xl max-sm:text-3xl leading-[110%]">%</span>
                    </div>
                    <p class="text-xl max-md:text-base max-sm:text-sm font-normal text-white">Faster Recovery</p>
                    <img class="absolute right-0 bottom-0 pointer-events-none"
                        src="./assets/images/svg/counter-two-img.svg" alt="plus">
                </div>
            </div>
        </div>
        </div>
    </section>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
