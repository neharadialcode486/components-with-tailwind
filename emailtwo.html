<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>email-js</title>
  <link rel="stylesheet" href="/assets/css/email.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        container: {
          padding: '12px',
          center: true,
          screens: {
            sm: "600px",
            md: "728px",
            lg: "984px",
            xl: "1320px",
            "2xl": "1496px",
          },
        },
        extend: {
          fontFamily:{
            fontInter:'"Inter", sans-serif;'

          },
        }
      }
    }
  </script>
</head>
<body class="font-fontInter">
<!-- ---------second-form--------- -->
<section class="min-h-screen flex items-center justify-center max-xl:my-9 max-sm:my-6">
    <div class="container px-0 max-sm:px-3">
        <div class="max-lg:flex-col flex justify-center items-center gap-12 max-lg:gap-6">
            <div class="flex items-center justify-center">
                <div class="bg-white shadow-[5px_7px_19px_-5px_#00000026] rounded-xl p-6 sm:min-w-[492px] max-sm:max-w-[492px]">
                    <form class="flex flex-col items-center">
                        <input type="text" placeholder="Name" class="text-[#000000B2] outline-none py-3 px-4 border border-[#00000070] rounded-xl mt-[48px] text-base placeholder:text-base placeholder:font-normal placeholder:text-[#000000B2] h-[46px] md:min-w-[425px]  max-md:w-[353px] max-lg:mt-7 max-[420px]:w-[303px]"/>
                        <input type="email" required placeholder="Email address" class="text-[#000000B2] outline-none py-3 px-4 border border-[#00000070] rounded-xl mt-4 text-base placeholder:text-base placeholder:font-normal placeholder:text-[#000000B2] h-[46px]  md:min-w-[425px]  max-md:w-[353px] max-[420px]:w-[303px]"/>
                        <input type="text" placeholder="Contact" class="text-[#000000B2] outline-none py-3 px-4 border border-[#00000070] rounded-xl mt-4 text-base placeholder:text-base placeholder:font-normal placeholder:text-[#000000B2] h-[46px] md:min-w-[425px]  max-md:w-[353px] max-[420px]:w-[303px]"/>
                        <textarea name="message" id="message" class="text-[#000000B2] outline-none py-3 px-4 border border-[#00000070] rounded-xl mt-4 text-base placeholder:text-base placeholder:font-normal placeholder:text-[#000000B2] md:min-w-[425px]  max-md:w-[353px] max-[420px]:w-[303px]" placeholder="Message"></textarea>
                        
                        <button type="submit" class="max-w-full mr-auto bg-[#3C278D] text-white font-semibold py-3  px-6 rounded-xl mt-[32px] mb-[46px] max-md:mb-10 max-sm:mb-5 duration-300 transition-all ease-linear hover:text-[#3C278D] hover:bg-transparent hover:border-[#3C278D] hover:border">Submit</button>
                    </form>
                </div>
            </div>
            <div class="flex items-center justify-center ">
            <div class="second-card-text">
                <h2 class="font-12  text-black text-4xl mt-[52px] max-md:mt-10 max-sm:mt-3 font-semibold leading-[119%] max-xl:text-[35px] max-lg:mt-3">Get In Touch</h2>
                <p class="font-normal text-base text-[#000000B2] pt-4 max-w-[441px] ">Lorem ipsum dolor sit amet consectetur. Velit pulvinar libero porttitor quam sed aliquet. Sodales vulputate elementum arcu donec. Feugiat nibh ullamcorper egestas lectus risus ornare ullamcorper fames. Cursus libero nec facilisis risus malesuada arcu cum.</p>
                <button class="mt-7 max-sm:mt-7 bg-[#3C278D] text-white font-semibold py-[14px] px-6 rounded-xl duration-300 transition-all ease-linear hover:text-[#3C278D] hover:bg-transparent hover:border-[#3C278D] hover:border min-w-[146px]">Get in Touch</button>
            </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
